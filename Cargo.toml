[package]
name = "anicca-subscribe"
version = "0.4.2"
edition = "2024"

[[bin]]
name = "anicca-subscribe"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5.38", features = ["derive"] }
color-eyre = "0.6.4"
eyre = "0.6.12"
matrix-sdk = { version = "0.19.1", default-features = false, features = ["eyre", "markdown", "e2e-encryption", "automatic-room-key-forwarding", "sqlite"] }
matrixbot-ezlogin = { version = "0.4", default-features = false }
reqwest = { version = "0.13.2", default-features = false, features = ["http2", "system-proxy"] }
# Use the same version with the one depended by matrix-sdk
rocksdb = { version = "0.25" }
wincode = { version = "0.6", features = ["derive", "alloc"] }
serde = "1.0"
serde_json = "1.0"
toml = "1.1"
tokio = { version = "1.45.1", features = ["rt", "macros", "rt-multi-thread"] }
tracing = "0.1.41"
tracing-error = "0.2.1"
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }
pluralizer = "0.6.0"

[features]
default = ["native-tls"]
native-tls = ["reqwest/native-tls"]
rustls-tls = ["reqwest/rustls"]

[profile.release]
strip = "symbols"
lto = "fat"
codegen-units = 1

[dev-dependencies]
once_cell = "1.21.3"
serial_test = "4.0.1"
tempfile = "3.20.0"
